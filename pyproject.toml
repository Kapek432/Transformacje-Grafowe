[project]
name = "grafy-dpo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[tool.ruff]
target-version = "py311"
