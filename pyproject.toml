[project]
name = "grafy-dpo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "openpyxl>=3.1,<4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.ruff]
target-version = "py311"
